    <rect x="334" y="238" width="128" height="34" rx="17" fill="#ffd27c"/><text x="398" y="260" text-anchor="middle">92 formulas</text>
    <rect x="474" y="238" width="118" height="34" rx="17" fill="#f6a5c0"/><text x="533" y="260" text-anchor="middle">Buckling / LTB</text>
  </g>
  <!-- beam motif -->
  <g transform="translate(700,70)" stroke="#7cc4ff" fill="none" stroke-width="2.5">
    <g stroke-width="2"><line x1="40" y1="20" x2="40" y2="62" marker-end="url(#a)"/><line x1="110" y1="20" x2="110" y2="62" marker-end="url(#a)"/><line x1="180" y1="20" x2="180" y2="62" marker-end="url(#a)"/><line x1="250" y1="20" x2="250" y2="62" marker-end="url(#a)"/><line x1="320" y1="20" x2="320" y2="62" marker-end="url(#a)"/><line x1="390" y1="20" x2="390" y2="62" marker-end="url(#a)"/></g>
    <line x1="30" y1="14" x2="400" y2="14" stroke-width="2"/>
    <rect x="30" y="66" width="370" height="14" fill="#7cc4ff" stroke="none" rx="2"/>
    <path d="M40,80 L22,112 L58,112 Z" fill="#1b2a41"/><path d="M390,80 L372,106 L408,106 Z M366,112 L414,112" fill="#1b2a41"/>
