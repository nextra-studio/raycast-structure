    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0,0 L4,8 L8,0" fill="none" stroke="#7cc4ff" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <text x="60" y="110" font-size="54" font-weight="700" fill="#ffffff">Structural Toolbox</text>
  <text x="60" y="152" font-size="24" fill="#9fb3c8">for Raycast on Windows</text>
  <text x="60" y="208" font-size="20" fill="#cfe3f7">sketch  →  equation  →  substituted values  →  result</text>
  <g font-size="15" fill="#0d1624" font-weight="600">
