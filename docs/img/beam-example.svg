<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0,0 L4,8 L8,0" fill="none" stroke="#7cc4ff" stroke-width="1.5"/></marker>
    <marker id="u" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto"><path d="M0,8 L4,0 L8,8" fill="none" stroke="#8be3b0" stroke-width="2"/></marker>
  </defs>
  <rect width="900" height="560" rx="16" fill="#0d1624"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#fff">simply, 6m, 3kN/m, C24, 100x300</text>
  <text x="30" y="62" font-size="14" fill="#9fb3c8">Illustration of the result view: loads, reactions, shear and moment (values from hand calculation)</text>

  <!-- loads -->
  <line x1="100" y1="100" x2="800" y2="100" stroke="#7cc4ff" stroke-width="2"/>
  <g stroke="#7cc4ff" stroke-width="2">
    <line x1="100" y1="100" x2="100" y2="140" marker-end="url(#d)"/><line x1="217" y1="100" x2="217" y2="140" marker-end="url(#d)"/><line x1="333" y1="100" x2="333" y2="140" marker-end="url(#d)"/><line x1="450" y1="100" x2="450" y2="140" marker-end="url(#d)"/><line x1="567" y1="100" x2="567" y2="140" marker-end="url(#d)"/><line x1="683" y1="100" x2="683" y2="140" marker-end="url(#d)"/><line x1="800" y1="100" x2="800" y2="140" marker-end="url(#d)"/>
  </g>
  <text x="450" y="88" text-anchor="middle" font-size="15" fill="#7cc4ff">q = 3 kN/m</text>
  <rect x="100" y="146" width="700" height="12" rx="2" fill="#d8e6f5"/>
  <path d="M100,158 L84,186 L116,186 Z" fill="#445b78"/>
  <path d="M800,158 L784,180 L816,180 Z" fill="#445b78"/><circle cx="790" cy="184" r="4" fill="#445b78"/><circle cx="810" cy="184" r="4" fill="#445b78"/>
  <line x1="100" y1="236" x2="100" y2="192" stroke="#8be3b0" stroke-width="3" marker-end="url(#u)"/>
  <line x1="800" y1="236" x2="800" y2="192" stroke="#8be3b0" stroke-width="3" marker-end="url(#u)"/>
  <text x="100" y="256" text-anchor="middle" font-size="15" fill="#8be3b0">R = 9 kN</text>
  <text x="800" y="256" text-anchor="middle" font-size="15" fill="#8be3b0">R = 9 kN</text>
  <line x1="100" y1="274" x2="800" y2="274" stroke="#445b78"/><text x="450" y="292" text-anchor="middle" font-size="13" fill="#9fb3c8">L = 6 m</text>

  <!-- shear -->
  <text x="30" y="324" font-size="15" font-weight="600" fill="#fff">Shear V (kN)</text>
  <line x1="100" y1="380" x2="800" y2="380" stroke="#445b78"/>
  <path d="M100,380 L100,326 L800,434 L800,380 Z" fill="#7cc4ff" fill-opacity="0.25" stroke="#7cc4ff" stroke-width="2"/>
  <text x="108" y="344" font-size="14" fill="#7cc4ff">+9.0</text><text x="760" y="428" font-size="14" fill="#7cc4ff">−9.0</text>

  <!-- moment -->
  <text x="30" y="468" font-size="15" font-weight="600" fill="#fff">Moment M (kN·m)</text>
  <line x1="100" y1="490" x2="800" y2="490" stroke="#445b78"/>
  <path d="M100,490 Q450,572 800,490 Z" fill="#8be3b0" fill-opacity="0.25" stroke="#8be3b0" stroke-width="2"/>
  <text x="450" y="548" text-anchor="middle" font-size="14" fill="#8be3b0">M,max = qL²/8 = 13.5 kN·m</text>
</svg>
